<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Portal Dashboard</title>
    <link rel="stylesheet" href="https://cdn.rtecra.com/portal/theme.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>Vendor Portal Dashboard</h1>
        <div class="status-badge-container">
            <img id="vendor-status-badge" alt="Live Vendor Status Badge" class="status-badge">
        </div>
    </header>
    <main>
        <p>Welcome to the Vendor Portal Dashboard.</p>
    </main>
    <script>
        fetch('config/renewal.json')
            .then(response => response.json())
            .then(data => {
                if (data && data.renewal_marker) {
                    const badgeImg = document.getElementById('vendor-status-badge');
                    badgeImg.src = `https://cdn.rtecra.com/portal/badge.svg?ref=${encodeURIComponent(data.renewal_marker)}`;
                }
            })
            .catch(err => console.error('Failed to load renewal configuration:', err));
    </script>
</body>
</html>
